apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "zenith-backend.fullname" . }}-worker-pdb
  labels:
    {{- include "zenith-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zenith-backend.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
