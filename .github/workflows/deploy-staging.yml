name: Deploy staging

on:
  workflow_run:
    workflows: ["Container Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy image to staging
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-environment.sh deploy
      - name: Verify staging health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: ./scripts/check-deployment-health.sh
      - name: Roll back failed staging deployment
        if: failure()
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-environment.sh rollback
