name: Scheduled cargo audit

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo install --locked cargo-audit --version 0.22.2
      - id: audit
        name: Audit dependencies
        continue-on-error: true
        run: |
          set +e
          cargo audit --json > cargo-audit.json 2>&1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat cargo-audit.json >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: File or update security issue
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const title = "Scheduled cargo audit found vulnerabilities";
            const report = fs.readFileSync("cargo-audit.json", "utf8").slice(0, 50000);
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const body = [
              "The scheduled `cargo audit` run found advisories in the dependency tree.",
              "",
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              "",
              "<details><summary>cargo-audit JSON report</summary>",
              "",
              "```json",
              report,
              "```",
              "</details>"
            ].join("\n");
            const issue = existing.data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `A new scheduled audit failed.\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body
              });
            }
      - name: Close resolved security issue
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const issue = issues.find(item => item.title === "Scheduled cargo audit found vulnerabilities" && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "The scheduled dependency audit is clean; closing this tracking issue." });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
            }
      - name: Fail on audit tooling errors
        if: steps.audit.outputs.exit_code != '0' && steps.audit.outputs.exit_code != '1'
        run: |
          echo "cargo audit could not inspect the dependency tree (exit ${{ steps.audit.outputs.exit_code }})." >&2
          exit 1
