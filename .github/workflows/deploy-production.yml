name: Promote production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing GHCR tag to promote (for example sha-<commit> or v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy selected image to production
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-environment.sh deploy
      - name: Verify production health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: ./scripts/check-deployment-health.sh
      - name: Roll back failed production deployment
        if: failure()
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-environment.sh rollback
