name: Container Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull --tag zenith-backend:ci .
      - name: Run image and verify health endpoint
        run: |
          docker run --detach --name zenith-backend-smoke \
            --publish 18081:8081 \
            --env DATABASE_URL=sqlite:///data/smoke.db \
            zenith-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health >/dev/null; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 1
          done
          docker logs zenith-backend-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm --force zenith-backend-smoke 2>/dev/null || true

  publish:
    name: Publish multi-arch image
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Sign image digest with keyless cosign
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
