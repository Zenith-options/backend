  /api/v2/alerts:
    get:
      operationId: getAlertsV2
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
    post:
      operationId: createAlertV2
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRequest"
      responses:
        "201":
          $ref: "#/components/responses/JsonOk"
  /api/v1/alerts/{id}:
    delete:
      operationId: deleteAlertV1
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Removed.
  /api/v2/alerts/{id}:
    delete:
      operationId: deleteAlertV2
      tags: [Alerts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Removed.
  /api/v1/portfolio/payoff:
    post:
      operationId: calculatePortfolioPayoffV1
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/v2/portfolio/payoff:
    post:
      operationId: calculatePortfolioPayoffV2
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/v1/portfolio/greeks:
    get:
      operationId: getPortfolioGreeksV1
      tags: [Portfolio]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
  /api/v2/portfolio/greeks:
    get:
      operationId: getPortfolioGreeksV2
      tags: [Portfolio]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/JsonOk"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Underlying:
      name: underlying
      in: query
      required: true
      schema: { type: string }
    UnderlyingPath:
      name: underlying
      in: path
      required: true
      schema: { type: string }
    Strike:
      name: strike
      in: query
      required: true
      schema: { type: number, exclusiveMinimum: true, minimum: 0 }
    ExpiryDays:
      name: expiry_days
      in: query
      required: true
      schema: { type: number, exclusiveMinimum: true, minimum: 0 }
    OptionType:
      name: option_type
      in: query
      required: true
      schema: { type: string, enum: [call, put] }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    JsonOk:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    ApiError:
      description: API failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              enum:
                - CLIENT_ERROR
                - CONFLICT
                - FORBIDDEN
                - INSUFFICIENT_BALANCE
                - INTERNAL_ERROR
                - INVALID_CREDENTIALS
                - INVALID_REQUEST
                - NOT_FOUND
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - UNAUTHENTICATED
                - UNPROCESSABLE_ENTITY
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string, format: uuid }
    SpotResponseV1:
      type: object
      required: [prices, vols]
      properties:
        prices:
          type: object
          additionalProperties: { type: number }
        vols:
          type: object
          additionalProperties: { type: number }
    SpotResponseV2:
      type: object
      required: [assets]
      properties:
        assets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AssetQuoteV2"
    AssetQuoteV2:
      type: object
      required: [price, implied_vol]
      properties:
        price: { type: number }
        implied_vol: { type: number }
    VersionUsage:
      type: object
      required: [v1, v2]
      properties:
        v1: { type: integer, format: int64 }
        v2: { type: integer, format: int64 }
    NonceRequest:
      type: object
      required: [wallet_address]
      properties:
        wallet_address: { type: string }
    NonceResponse:
      type: object
      required: [nonce, message]
      properties:
        nonce: { type: string }
        message: { type: string }
    VerifyRequest:
      type: object
      required: [wallet_address, message, signature]
      properties:
        wallet_address: { type: string }
        message: { type: string }
        signature:
          type: string
          description: Base64-encoded 64-byte Ed25519 signature.
    VerifyResponse:
      type: object
      required: [token, wallet_address]
      properties:
        token: { type: string }
        wallet_address: { type: string }
    PositionRequest:
      type: object
      required: [underlying, option_type, position_type, strike, expiry_days, contracts]
      properties:
        underlying: { type: string }
        option_type: { type: string, enum: [call, put] }
        position_type: { type: string, enum: [long, short] }
        strike: { type: number }
        expiry_days: { type: number }
        contracts: { type: integer }
    RollRequest:
      type: object
      required: [strike, expiry_days]
      properties:
        strike: { type: number }
        expiry_days: { type: number }
    StrategyRequest:
      type: object
      required: [legs]
      properties:
        legs:
          type: array
          items:
            $ref: "#/components/schemas/PositionRequest"
    WatchlistRequest:
      type: object
      required: [underlying]
      properties:
        underlying: { type: string }
    AlertRequest:
      type: object
      required: [underlying, condition, target_price]
      properties:
        underlying: { type: string }
        condition: { type: string, enum: [above, below] }
        target_price: { type: number }
