# Docker Compose example: Zenith backend with continuous backup.
#
# The backend writes its SQLite database to /data/zenith.db on a named
# volume. The litestream sidecar watches the same volume read-only and
# replicates the database to object storage continuously (RPO < 10s — see
# docs/runbooks/restore.md).
#
# Copy .env.example to .env and fill in the LITESTREAM_* values, then:
#   docker compose -f deploy/docker-compose.yml up

services:
  zenith-backend:
    build: ..
    environment:
      DATABASE_URL: sqlite:///data/zenith.db
    volumes:
      - zenith-data:/data
    ports:
      - "8081:8081"

  litestream:
    image: litestream/litestream:v0.5.17
    command: replicate -config /etc/litestream.yml
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_REGION: ${LITESTREAM_REGION}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    volumes:
      # Read-only: litestream only reads the database and its WAL.
      - zenith-data:/data:ro
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - zenith-backend
    restart: unless-stopped

volumes:
  zenith-data:
