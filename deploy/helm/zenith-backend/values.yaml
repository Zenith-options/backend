image:
  repository: ghcr.io/agudajohn793/backendd
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 2
worker:
  replicaCount: 1

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteMany
  size: 5Gi
  storageClassName: ""
  mountPath: /data

service:
  type: ClusterIP
  port: 8081

runtimeSecretName: zenith-backend-runtime
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: backend-secrets
    kind: ClusterSecretStore
  remoteKey: zenith/backend
  targetName: zenith-backend-runtime

database:
  urlKey: DATABASE_URL
redis:
  urlKey: REDIS_URL

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu:
    averageUtilization: 70
  requestRate:
    enabled: true
    metricName: http_requests_per_second
    averageValue: "20"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  redisPodSelector:
    app.kubernetes.io/name: redis
  redisPort: 6379

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

workerResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
