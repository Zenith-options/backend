[workspace]
members = [".", "fuzz"]

# When building fuzz targets in release mode (cargo fuzz run ...) we want
# debug info so crash stack traces are symbolised.  This is a workspace-level
# profile so it applies to both the main crate and the fuzz crate.
[profile.release]
debug = true

[package]
name = "zenith-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zenith-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
anyhow = "1"
async-graphql = { version = "=7.2.1", features = ["dataloader"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "compression-gzip", "compression-br", "compression-zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros", "time", "chrono", "uuid", "json", "rust_decimal"] }
dotenvy = "0.15"
toml = "0.8"
httpdate = "1"
ed25519-dalek = "2"
data-encoding = "2"
rand = "0.8"
tower_governor = "0.4"
validator = { version = "0.18", features = ["derive"] }
secrecy = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"
base64 = "0.22"
rust_decimal = { version = "1", features = ["serde", "macros"] }
chrono = "0.4"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
futures = "0.3"
csv = "1"
metrics = "0.24"
arrow = "53"
parquet = "53"
moka = { version = "0.12", features = ["sync"] }
redis = { version = "0.27", features = ["tokio-comp"] }
opentelemetry = { version = "0.33.0", features = ["trace"], default-features = false }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio", "trace"], default-features = false }
opentelemetry-otlp = { version = "0.33.0", features = ["trace", "grpc-tonic"], default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
utoipa = { version = "5", features = ["axum_extras", "time"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
proptest = "1"

# `cfg(kani)` is defined by the Kani verifier (see src/kani_proofs.rs);
# declare it here so rustc's check-cfg lint accepts it in normal builds too.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
